name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag whose failed publication should be retried
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-please:
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish:
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || inputs.tag != '') }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache: false
      - run: npm ci
      - run: mise x -- hk check --all
      - run: npm run check:release
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - run: npm run test:coverage
      - name: Read the release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Pack the npm artifact
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the packed artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # zizmor: ignore[adhoc-packages] Installing the local release tarball is the package smoke test.
        run: npm install --prefix "$RUNNER_TEMP/fr-grocery-smoke" --ignore-scripts --omit=dev "$RUNNER_TEMP/fr-grocery-mcp-$VERSION.tgz"
      - name: Smoke test the packed MCP server
        run: node scripts/smoke-package.ts "$RUNNER_TEMP/fr-grocery-smoke/node_modules/.bin/fr-grocery-mcp"
      - name: Check whether this npm version already exists
        id: npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if npm view "fr-grocery-mcp@$VERSION" version --json > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm with trusted publishing
        if: steps.npm.outputs.exists == 'false'
        run: npm publish --access public --provenance
      - name: Verify the npm version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: test "$(npm view "fr-grocery-mcp@$VERSION" version)" = "$VERSION"
      - name: Download the pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.5/mcp-publisher_linux_amd64.tar.gz"
          echo "2d151ac57275c9a6684d9d22b1cba81058bab195ea0a162e8fce3c6a5ec32812  $RUNNER_TEMP/mcp-publisher.tar.gz" | shasum --algorithm 256 --check
          tar --extract --gzip --file "$RUNNER_TEMP/mcp-publisher.tar.gz" mcp-publisher
      - name: Authenticate to the MCP Registry with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish

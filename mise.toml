min_version = "2026.1.0"

[tools]
node = "26"
hk = "2.8.1"
jactionlint = "2.3.0"
pinact = "5.0.1"
rumdl = "0.3.0"
shellcheck = "0.11.0"
zizmor = "1.31.1"

[settings]
lockfile = true

# hk runs the linters from node_modules through `mise x`, and does not install them itself.
[env]
_.path = ["node_modules/.bin"]

[tasks.chrome]
description = "Debug Chrome (port 9222) on a dedicated profile, where you log in once to each site"
run = 'case "$(uname -s)" in Darwin) BROWSER="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" ;; Linux) BROWSER="${GOOGLE_CHROME:-google-chrome}" ;; *) echo "Unsupported OS: $(uname -s)." >&2; exit 1 ;; esac; "$BROWSER" --remote-debugging-port=9222 --user-data-dir="$HOME/.fr-grocery-mcp/chrome" --no-first-run --no-default-browser-check'

[tasks.check]
description = "typecheck + lint + tests with coverage"
run = "npm run check"

[tasks.lint]
description = "linters and hygiene checks shared by the hook and CI (hk check --all)"
run = "hk check --all"
